name: Deploy portfolio (web + gift-api)

# The portfolio site and gift-api ship as ONE image to the App Service
# `mallorygiesie` -> https://mallorygiesie.azurewebsites.net (URL preserved).
# Triggers on changes to the frontend, the gift backend, or the build itself.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/gift-api/**"
      - "Dockerfile"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch: {}

# OIDC federated login to Azure — no stored secret.
permissions:
  id-token: write
  contents: read

env:
  ACR: mallorygiesie
  IMAGE: mallorygiesie          # existing image name the App Service pulls
  RESOURCE_GROUP: mallory-website
  WEBAPP: mallorygiesie

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Build on the runner with real Docker (not `az acr build`): the App
      # Insights connection string contains semicolons, which break ACB's
      # internally generated shell command. docker build handles them cleanly.
      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR }}

      - name: Build & push image (bakes NEXT_PUBLIC_* at build time)
        env:
          SHA_TAG: ${{ env.ACR }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
          LATEST_TAG: ${{ env.ACR }}.azurecr.io/${{ env.IMAGE }}:latest
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_GIFT_APP_API="${{ vars.NEXT_PUBLIC_GIFT_APP_API }}" \
            --build-arg NEXT_PUBLIC_SITE_RISK_API="${{ vars.NEXT_PUBLIC_SITE_RISK_API }}" \
            --build-arg NEXT_PUBLIC_APPINSIGHTS_CONNECTION_STRING="${{ secrets.APPINSIGHTS_CONNECTION_STRING }}" \
            -f Dockerfile \
            -t "$SHA_TAG" -t "$LATEST_TAG" .
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"

      - name: Point App Service at the new image
        run: |
          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP }} \
            --container-image-name ${{ env.ACR }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
          az webapp restart -g ${{ env.RESOURCE_GROUP }} -n ${{ env.WEBAPP }}
