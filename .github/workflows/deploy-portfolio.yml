name: Deploy portfolio (web + gift-api)

# The portfolio site and gift-api ship as ONE image to the App Service
# `mallorygiesie` -> https://mallorygiesie.azurewebsites.net (URL preserved).
# Triggers on changes to the frontend, the gift backend, or the build itself.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/gift-api/**"
      - "Dockerfile"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch: {}

# OIDC federated login to Azure — no stored secret.
permissions:
  id-token: write
  contents: read

env:
  ACR: mallorygiesie
  IMAGE: mallorygiesie          # existing image name the App Service pulls
  RESOURCE_GROUP: mallory-website
  WEBAPP: mallorygiesie

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR (bakes NEXT_PUBLIC_* at build time)
        run: |
          az acr build \
            --registry ${{ env.ACR }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --image ${{ env.IMAGE }}:latest \
            --build-arg NEXT_PUBLIC_GIFT_APP_API="${{ vars.NEXT_PUBLIC_GIFT_APP_API }}" \
            --build-arg NEXT_PUBLIC_SITE_RISK_API="${{ vars.NEXT_PUBLIC_SITE_RISK_API }}" \
            --build-arg NEXT_PUBLIC_APPINSIGHTS_CONNECTION_STRING="${{ secrets.APPINSIGHTS_CONNECTION_STRING }}" \
            --file Dockerfile .

      - name: Point App Service at the new image
        run: |
          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP }} \
            --container-image-name ${{ env.ACR }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
          az webapp restart -g ${{ env.RESOURCE_GROUP }} -n ${{ env.WEBAPP }}
