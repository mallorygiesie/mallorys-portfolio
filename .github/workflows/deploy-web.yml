name: Deploy web (portfolio)

# Independent pipeline: only runs when the portfolio frontend changes.
# The frontend is a static Next.js export -> Azure Static Web Apps (free tier).
# The NEXT_PUBLIC_* values are baked in at build time, so they live here.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build static export
        working-directory: apps/web
        env:
          # Point the demos at the deployed backends. Set these as repo secrets/vars.
          NEXT_PUBLIC_GIFT_APP_API: ${{ vars.NEXT_PUBLIC_GIFT_APP_API }}
          NEXT_PUBLIC_SITE_RISK_API: ${{ vars.NEXT_PUBLIC_SITE_RISK_API }}
          NEXT_PUBLIC_APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          npm ci
          npm run build   # next.config.ts has output: "export" -> ./out

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/out
          skip_app_build: true
