name: Deploy site-risk-api

# Independent pipeline: only runs when the SiteRisk backend changes.
# Deploys to the App Service `mallorygiesie-siterisk` (same B1 plan) ->
# https://mallorygiesie-siterisk.azurewebsites.net
on:
  push:
    branches: [main]
    paths:
      - "apps/site-risk-api/**"
      - ".github/workflows/deploy-site-risk-api.yml"
  workflow_dispatch: {}

# OIDC federated login to Azure — no stored secret.
permissions:
  id-token: write
  contents: read

env:
  ACR: mallorygiesie
  IMAGE: site-risk-api
  RESOURCE_GROUP: mallory-website
  WEBAPP: mallorygiesie-siterisk

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry ${{ env.ACR }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --image ${{ env.IMAGE }}:latest \
            apps/site-risk-api

      - name: Point App Service at the new image
        run: |
          az webapp config container set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.WEBAPP }} \
            --container-image-name ${{ env.ACR }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
          az webapp restart -g ${{ env.RESOURCE_GROUP }} -n ${{ env.WEBAPP }}
