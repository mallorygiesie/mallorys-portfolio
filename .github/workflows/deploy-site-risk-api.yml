name: Deploy site-risk-api

# Independent pipeline: only runs when the site-risk-api service changes.
on:
  push:
    branches: [main]
    paths:
      - "apps/site-risk-api/**"
      - ".github/workflows/deploy-site-risk-api.yml"
  workflow_dispatch: {}

env:
  ACR: mallorygiesie.azurecr.io
  IMAGE: site-risk-api
  RESOURCE_GROUP: mallory-website
  CONTAINER_APP: site-risk-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name mallorygiesie

      - name: Build & push image
        working-directory: apps/site-risk-api
        run: |
          TAG="${{ env.ACR }}/${{ env.IMAGE }}:${{ github.sha }}"
          docker build -t "$TAG" -t "${{ env.ACR }}/${{ env.IMAGE }}:latest" .
          docker push "$TAG"
          docker push "${{ env.ACR }}/${{ env.IMAGE }}:latest"

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR }}/${{ env.IMAGE }}:${{ github.sha }}
